<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>通讯录浏览器验收</title><style>body{font:16px/1.65 'Microsoft YaHei',sans-serif;margin:35px;color:#163f3d;background:#f7f9f8}h1{font-size:26px}li{margin:7px 0}.pass{color:#216144}.fail{color:#aa3232}iframe{width:1050px;height:820px;border:1px solid #c8d8d0;margin-top:20px}#summary{font-size:20px;font-weight:bold}</style><h1>通讯录真实浏览器验收</h1><p id="summary">运行中…</p><ol id="results"></ol><iframe id="app" src="../index.html" title="被测通讯录"></iframe><script>
const frame=document.getElementById('app'),out=document.getElementById('results');let w,d,passed=0,failed=0;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function ok(value,message){if(!value)throw Error(message||'断言失败');}
async function test(name,fn){try{await fn();passed++;out.insertAdjacentHTML('beforeend','<li class="pass">通过：'+name+'</li>');}catch(e){failed++;out.insertAdjacentHTML('beforeend','<li class="fail">失败：'+name+' — '+e.message+'</li>');}}
const el=id=>d.getElementById(id),click=s=>d.querySelector(s).click();
function input(id,value){const t=el(id);t.value=value;t.dispatchEvent(new w.Event('input',{bubbles:true}));}
function attach(){w=frame.contentWindow;d=frame.contentDocument;}
const count=()=>d.querySelectorAll('.contact-row').length;
async function reload(){await new Promise(r=>{frame.onload=()=>{attach();r();};w.location.reload();});await delay(50);}
async function chooseFile(file){const dt=new w.DataTransfer();dt.items.add(file);el('excel-file').files=dt.files;el('excel-file').dispatchEvent(new w.Event('change',{bubbles:true}));await delay(200);}
frame.onload=async()=>{attach();frame.onload=null;let old={};for(const k of ['contacts-course-v1-demo','contacts-course-v1-personal','contacts-course-v1-space'])old[k]=w.localStorage.getItem(k);try{
 w.localStorage.removeItem('contacts-course-v1-demo');w.localStorage.removeItem('contacts-course-v1-personal');w.localStorage.removeItem('contacts-course-v1-space');await reload();
 await test('演示空间有 8 位明确标注的虚构联系人',()=>{ok(count()===8);ok(!el('demo-banner').hidden);});
 await test('收藏切换和收藏筛选',()=>{const before=Number(el('count-favorites').textContent);click('[data-star="demo-1"]');ok(Number(el('count-favorites').textContent)===before-1);el('nav-favorites').click();ok(count()===before-1);el('nav-all').click();});
 await test('邮箱搜索和清除筛选',()=>{input('search','lin.xu@example.com');ok(count()===1);input('search','根本不存在');ok(count()===0);click('[data-clear]');ok(count()===8);});
 await test('真实空间初始为空，与演示空间隔离',()=>{el('start-own').click();ok(count()===0);ok(el('demo-banner').hidden);});
 await test('空表单不会提交，显示姓名和联系方式错误',()=>{el('add-btn').click();el('contact-form').requestSubmit();ok(el('editor').open);ok(el('error-name').textContent);ok(el('error-methods').textContent);ok(count()===0);});
 await test('新增多种联系方式与收藏，用户输入安全转义',()=>{input('name','<img src=x onerror=alert(1)>');input('company','测试组织');input('notes','测试备注\n第二行');const rows=el('method-rows');rows.querySelector('.method-input').value='测试号码 A';el('add-method').click();let row=rows.lastElementChild;row.querySelector('select').value='Email';row.querySelector('select').dispatchEvent(new w.Event('change',{bubbles:true}));row.querySelector('.method-input').value='qa@example.com';el('add-method').click();row=rows.lastElementChild;row.querySelector('select').value='Custom';row.querySelector('select').dispatchEvent(new w.Event('change',{bubbles:true}));row.querySelector('.custom-type').value='课程账号';row.querySelector('.method-input').value='测试账号';el('favorite').checked=true;el('contact-form').requestSubmit();ok(!el('editor').open);ok(count()===1);ok(!d.querySelector('.person-name img'));ok(d.querySelector('.person-name').textContent.includes('<img'));ok(el('detail-pane').querySelectorAll('.detail-method').length===3);});
 await test('编辑保留多联系方式并更新联系人',()=>{click('[data-edit]');ok(el('method-rows').children.length===3);ok(el('method-rows').firstElementChild.querySelector('.custom-type').hidden);input('name','浏览器验收联系人');el('contact-form').requestSubmit();ok(count()===1);ok(d.querySelector('.person-name').textContent==='浏览器验收联系人');});
 await test('刷新页面后联系人仍然存在',async()=>{await reload();ok(count()===1);ok(d.querySelector('.person-name').textContent==='浏览器验收联系人');});
 await test('收藏重绘后仍保留键盘焦点',()=>{const star=d.querySelector('.star-button');star.focus();star.click();ok(d.activeElement.matches('[data-star]'));d.activeElement.click();});
 await test('Excel 库按需加载，选择文件入口有可见键盘焦点',async()=>{ok(!w.XLSX);el('import-btn').click();for(let i=0;i<60&&!w.XLSX;i++)await delay(50);ok(w.XLSX);el('choose-file').focus();ok(d.activeElement===el('choose-file'));ok(el('choose-file').getBoundingClientRect().height>=44);el('import-dialog').close();});
 let captured;
 await test('导出按钮生成含全部联系方式的真实 Excel 工作簿',async()=>{const write=w.XLSX.writeFile;w.XLSX.writeFile=(wb,name)=>{captured=wb;ok(name.endsWith('.xlsx'));};el('export-btn').click();await delay(30);w.XLSX.writeFile=write;ok(captured);const rows=w.XLSX.utils.sheet_to_json(captured.Sheets.Contacts);ok(rows.length===1);ok(JSON.parse(rows[0]['Contact methods JSON']).length===3);});
 await test('删除需要确认，且可撤销',()=>{click('[data-delete]');ok(el('confirm-dialog').open);el('confirm-delete').click();ok(count()===0);el('toast').querySelector('button').click();ok(count()===1);});
 await test('Excel 文件导入预览：有效、重复、错误行分别处理',async()=>{const rows=w.XLSX.utils.sheet_to_json(captured.Sheets.Contacts);rows.push({姓名:'导入验收联系人',手机:'测试号码 B',收藏:'是'});rows.push({姓名:'错误邮箱',邮箱:'invalid'});const wb=w.XLSX.utils.book_new();w.XLSX.utils.book_append_sheet(wb,w.XLSX.utils.json_to_sheet(rows),'联系人');const b=w.XLSX.write(wb,{type:'array',bookType:'xlsx'});el('import-btn').click();await chooseFile(new w.File([b],'验收.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));ok(el('import-preview').textContent.includes('1 contact ready to import'));ok(el('import-preview').textContent.includes('1 duplicate row'));ok(el('import-preview').textContent.includes('1 invalid row'));ok(count()===1);el('confirm-import').click();ok(count()===2);});
 await test('损坏的 Excel 不会修改已有数据',async()=>{el('import-btn').click();await chooseFile(new w.File(['bad content'],'坏文件.xlsx'));ok(el('confirm-import').disabled);ok(el('import-preview').textContent.includes('not a valid'));ok(count()===2);el('import-dialog').close();});
 await test('演示和真实空间切换互不影响，帮助入口可用',()=>{el('switch-space').click();ok(count()===8);el('switch-space').click();ok(count()===2);el('footer-help').click();ok(el('help-dialog').open);el('help-dialog').close();});
 await test('卡片视图和列表视图可正常切换',()=>{el('view-grid').click();ok(el('list-table').classList.contains('grid-view'));el('view-list').click();ok(!el('list-table').classList.contains('grid-view'));});
 await test('移动详情取消收藏：切到下一位及空态时焦点保持可见',()=>{el('nav-favorites').click();ok(count()===2);click('[data-open]');ok(el('detail-pane').classList.contains('mobile-open'));el('detail-pane').querySelector('[data-star]').focus();el('detail-pane').querySelector('[data-star]').click();ok(count()===1);ok(el('detail-pane').contains(d.activeElement));ok(!d.activeElement.closest('[inert]'));el('detail-pane').querySelector('[data-star]').click();ok(count()===0);ok(!el('detail-pane').classList.contains('mobile-open'));ok(d.activeElement!==d.body);ok(!d.activeElement.closest('[inert]'));ok(d.activeElement.getClientRects().length);el('nav-all').click();ok(count()===2);});
 await test('本地存储写入失败时不假报保存成功、不丢原数据',()=>{el('add-btn').click();input('name','不能保存');el('method-rows').querySelector('.method-input').value='临时';const set=w.Storage.prototype.setItem;w.Storage.prototype.setItem=function(){throw Error('quota');};try{el('contact-form').requestSubmit();ok(el('editor').open);ok(el('error-save').textContent);ok(count()===2);}finally{w.Storage.prototype.setItem=set;const confirm=w.confirm;w.confirm=()=>true;el('editor').querySelector('[data-close]').click();w.confirm=confirm;}});
 await test('损坏的本地数据受到保护，不会被新数据覆盖',async()=>{const saved=w.localStorage.getItem('contacts-course-v1-personal');w.localStorage.setItem('contacts-course-v1-personal','{bad');await reload();ok(!el('storage-alert').hidden);el('add-btn').click();input('name','不覆盖');el('method-rows').querySelector('.method-input').value='临时';el('contact-form').requestSubmit();ok(w.localStorage.getItem('contacts-course-v1-personal')==='{bad');el('editor').close();w.localStorage.setItem('contacts-course-v1-personal',saved);await reload();ok(count()===2);});
 }catch(e){failed++;out.insertAdjacentHTML('beforeend','<li class="fail">验收环境错误：'+e.message+'</li>');}finally{for(const[k,v]of Object.entries(old))v===null?w.localStorage.removeItem(k):w.localStorage.setItem(k,v);}
 document.getElementById('summary').textContent=`${passed} 项通过，${failed} 项失败`;document.title=`QA ${passed} PASS ${failed} FAIL`;document.getElementById('summary').style.color=failed?'#a33':'#216144';
};
</script></html>
